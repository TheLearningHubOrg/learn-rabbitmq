[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-rabbitmq"
version = "1.0.0"
description = "Production-grade RabbitMQ & AMQP distributed messaging reference implementation in Python"
readme = "README.md"
authors = [{ name = "The Learning Hub" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pika>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
