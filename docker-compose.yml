services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: learn-rabbitmq-broker
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: learn-rabbitmq-app
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    command: ["python", "src/demo.py"]
